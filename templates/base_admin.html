{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-lg min-h-screen hidden md:block">
            <div class="p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-6">Admin Portal</h2>
                <nav class="space-y-2">
                    {% block sidebar_menu %}{% endblock %}
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            {% block admin_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
