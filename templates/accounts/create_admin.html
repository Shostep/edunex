<!DOCTYPE html>
<html>
<head>
    <title>Create Admin - EduNex</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .form-box { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.1); 
            width: 400px; 
        }
        h1 { 
            color: #1e40af; 
            text-align: center; 
            margin-bottom: 10px; 
        }
        p { 
            color: #6b7280; 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .alert { 
            padding: 12px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            font-size: 14px; 
        }
        .alert-error { 
            background: #fee2e2; 
            color: #991b1b; 
            border: 1px solid #fecaca; 
        }
        .alert-success { 
            background: #d1fae5; 
            color: #065f46; 
            border: 1px solid #a7f3d0; 
        }
        .alert-info { 
            background: #dbeafe; 
            color: #1e40af; 
            border: 1px solid #bfdbfe; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #374151; 
            font-size: 14px; 
            font-weight: 600; 
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box; 
            transition: border-color 0.2s; 
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            outline: none; 
            border-color: #1e40af; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #1e40af; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #1e3a8a; 
        }
        .login-link { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 14px; 
        }
        .login-link a { 
            color: #1e40af; 
            text-decoration: none; 
        }
        .login-link a:hover { 
            text-decoration: underline; 
        }
        .required { 
            color: #dc2626; 
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Create Admin Account</h1>
        <p>Set up your first administrator account for EduNex</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" required placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" required placeholder="Enter a strong password" minlength="8">
            </div>

            <div class="form-group">
                <label for="surname">Surname <span class="required">*</span></label>
                <input type="text" id="surname" name="surname" required placeholder="Your surname">
            </div>

            <div class="form-group">
                <label for="first_name">First Name <span class="required">*</span></label>
                <input type="text" id="first_name" name="first_name" required placeholder="Your first name">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1234567890">
            </div>

            <button type="submit">Create Admin Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="{% url 'accounts:login' %}">Login here</a>
        </div>
    </div>
</body>
</html>
