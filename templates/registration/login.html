{% extends "base_auth.html" %}

{% block title %}Login - {{ university_name }}{% endblock %}

{% block auth_content %}
<div class="bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
        <p class="text-gray-600 mt-2">Sign in to your account</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input type="email" name="email" required 
                   class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   placeholder="your@email.com">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input type="password" name="password" required 
                   class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Enter your password">
        </div>

        <div class="flex items-center justify-between">
            <label class="flex items-center">
                <input type="checkbox" name="remember" class="rounded border-gray-300">
                <span class="ml-2 text-sm text-gray-600">Remember me</span>
            </label>
            <a href="{% url 'accounts:password_reset' %}" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
        </div>

        <button type="submit" 
                class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:opacity-90 transition">
            Sign In
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-600">
            Don't have an account? 
            <a href="{% url 'admission:home' %}" class="text-blue-600 hover:underline">Apply for Admission</a>
        </p>
    </div>
</div>
{% endblock %}
