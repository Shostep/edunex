<!DOCTYPE html>
<html>
<head>
    <title>Setup Complete - EduNex</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .success-box { background: white; padding: 50px; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
        .checkmark { font-size: 80px; color: #10b981; margin-bottom: 20px; }
        h1 { color: #1e40af; margin-bottom: 15px; }
        p { color: #6b7280; margin-bottom: 30px; font-size: 16px; }
        .btn { display: inline-block; padding: 14px 40px; background: #1e40af; color: white; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #1e3a8a; }
        .info { margin-top: 20px; padding: 15px; background: #f0f9ff; border-radius: 8px; border-left: 4px solid #1e40af; text-align: left; }
        .info p { margin: 5px 0; font-size: 14px; color: #374151; }
    </style>
</head>
<body>
    <div class="success-box">
        <div class="checkmark">✓</div>
        <h1>Setup Complete!</h1>
        <p>Your university management system has been configured successfully.</p>
        
        <div class="info">
            <p><strong>University:</strong> {{ config.name|default:"EduNex University" }}</p>
            <p><strong>Status:</strong> Active</p>
            <p><strong>Setup Date:</strong> {{ config.setup_completed_at|default:"Just now" }}</p>
        </div>
        
        <a href="/" class="btn" style="margin-top: 30px;">Go to Dashboard</a>
    </div>
</body>
</html>
