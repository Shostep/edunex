{% extends "base.html" %}

{% block title %}Setup Wizard - Step 1: University Identity{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-bold text-gray-900">University Setup</h1>
                    <span class="text-sm text-gray-500">Step 1 of 7</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-primary h-2 rounded-full" style="width: 14%"></div>
                </div>
            </div>

            <h2 class="text-xl font-semibold text-gray-800 mb-6">University Identity</h2>

            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">University Full Name</label>
                    <input type="text" name="name" required 
                           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                           placeholder="e.g., Lagos State University of Education">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Short Name / Abbreviation</label>
                    <input type="text" name="short_name" required maxlength="20"
                           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500"
                           placeholder="e.g., LASUED">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">State</label>
                    <select name="state" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">Select State</option>
                        <option value="Lagos">Lagos</option>
                        <option value="Oyo">Oyo</option>
                        <option value="Osun">Osun</option>
                        <option value="Ogun">Ogun</option>
                        <option value="Ekiti">Ekiti</option>
                        <option value="Ondo">Ondo</option>
                        <option value="Edo">Edo</option>
                        <option value="Delta">Delta</option>
                        <option value="Rivers">Rivers</option>
                        <option value="Enugu">Enugu</option>
                        <option value="Anambra">Anambra</option>
                        <option value="Imo">Imo</option>
                        <option value="Abia">Abia</option>
                        <option value="Akwa Ibom">Akwa Ibom</option>
                        <option value="Cross River">Cross River</option>
                        <option value="Kano">Kano</option>
                        <option value="Kaduna">Kaduna</option>
                        <option value="Katsina">Katsina</option>
                        <option value="Jigawa">Jigawa</option>
                        <option value="Sokoto">Sokoto</option>
                        <option value="Zamfara">Zamfara</option>
                        <option value="Kebbi">Kebbi</option>
                        <option value="Niger">Niger</option>
                        <option value="Kwara">Kwara</option>
                        <option value="Kogi">Kogi</option>
                        <option value="Benue">Benue</option>
                        <option value="Plateau">Plateau</option>
                        <option value="Nasarawa">Nasarawa</option>
                        <option value="Taraba">Taraba</option>
                        <option value="Adamawa">Adamawa</option>
                        <option value="Borno">Borno</option>
                        <option value="Yobe">Yobe</option>
                        <option value="Bauchi">Bauchi</option>
                        <option value="Gombe">Gombe</option>
                        <option value="Ebonyi">Ebonyi</option>
                        <option value="Bayelsa">Bayelsa</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">University Logo</label>
                    <input type="file" name="logo" accept="image/*"
                           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Recommended: 200x200px, PNG or JPG</p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Primary Color</label>
                        <input type="color" name="primary_color" value="#1e40af"
                               class="w-full h-12 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Secondary Color</label>
                        <input type="color" name="secondary_color" value="#3b82f6"
                               class="w-full h-12 border rounded-lg">
                    </div>
                </div>

                <div class="flex justify-end">
                    <button type="submit" 
                            class="px-8 py-3 bg-primary text-white rounded-lg font-medium hover:opacity-90 transition">
                        Next Step →
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
