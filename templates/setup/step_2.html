<!DOCTYPE html>
<html>
<head>
    <title>Step 2 - Indigene Settings | EduNex Setup</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 700px; margin: 50px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        .progress-bar { width: 100%; height: 20px; background: #e5e7eb; border-radius: 10px; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: #1e40af; border-radius: 10px; width: 28%; }
        h1 { color: #1e40af; margin-bottom: 10px; }
        .step-info { color: #6b7280; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #374151; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 14px; }
        .checkbox-group { display: flex; align-items: center; margin-bottom: 20px; }
        .checkbox-group input { width: auto; margin-right: 10px; }
        .btn { padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; text-decoration: none; display: inline-block; }
        .btn-primary { background: #1e40af; color: white; }
        .btn-secondary { background: #6b7280; color: white; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <h1>Indigene Verification Settings</h1>
        <p class="step-info">Step 2 of 7</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="checkbox-group">
                <input type="checkbox" name="indigene_verification_required" id="verify" checked>
                <label for="verify">Require Indigene Verification</label>
            </div>
            <div class="form-group">
                <label>Verification Fee (₦)</label>
                <input type="number" name="indigene_verification_fee" value="5000">
            </div>
            <a href="{% url 'setup:wizard_step' step=1 %}" class="btn btn-secondary">Previous</a>
            <button type="submit" class="btn btn-primary">Next Step</button>
        </form>
    </div>
</body>
</html>
